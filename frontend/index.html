<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون آنلاین شیمی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
        <h1 class="text-xl font-bold text-center mb-4 text-emerald-400">آزمون آنلاین شیمی دوازدهم</h1>
        <div id="app">
            <div id="quiz-container">
                <p class="text-center text-slate-400">در حال بارگذاری سوالات...</p>
            </div>
            <button id="submit-btn" onclick="submitExam()" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl hidden transition">ثبت نهایی و دریافت کارنامه</button>
        </div>
        <div id="result-container" class="hidden text-center">
            <h2 class="text-2xl font-black text-amber-400 mb-2">کارنامه آزمون</h2>
            <p id="score-text" class="text-lg mb-4"></p>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-right space-y-2">
                <p id="correct-text"></p>
                <p id="incorrect-text"></p>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let userAnswers = {};
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadQuestions() {
            try {
                const res = await fetch('/api/questions');
                const data = await res.json();
                questions = data.questions;
                renderQuiz();
            } catch (err) {
                document.getElementById('quiz-container').innerHTML = '<p class="text-red-400 text-center">خطا در بارگذاری سوالات</p>';
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            let html = '';
            questions.forEach((q, index) => {
                html += `<div class="mb-6 pb-4 border-b border-slate-700">
                    <p class="font-semibold mb-3">${index + 1}. ${q.question}</p>
                    <div class="space-y-2">`;
                q.options.forEach((opt, optIndex) => {
                    html += `<label class="flex items-center gap-3 p-3 rounded-lg bg-slate-900/50 border border-slate-700 hover:border-emerald-500 cursor-pointer transition">
                        <input type="radio" name="q_${q.id}" value="${optIndex}" onchange="userAnswers[${q.id}] = ${optIndex}" class="accent-emerald-500">
                        <span class="text-sm">${opt}</span>
                    </label>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
            document.getElementById('submit-btn').classList.remove('hidden');
        }

        async function submitExam() {
            const userId = tg.initDataUnsafe?.user?.id || 'guest_user';
            const username = tg.initDataUnsafe?.user?.username || 'Guest';

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: String(userId), username: username, answers: userAnswers })
                });
                const result = await res.json();
                
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('submit-btn').classList.add('hidden');
                
                const resContainer = document.getElementById('result-container');
                resContainer.classList.remove('hidden');
                document.getElementById('score-text').innerText = `درصد نهایی: ${result.score}%`;
                document.getElementById('correct-text').innerText = `پاسخ‌های درست: ${result.correct}`;
                document.getElementById('incorrect-text').innerText = `پاسخ‌های غلط: ${result.incorrect}`;
            } catch (err) {
                alert('خطا در ثبت آزمون!');
            }
        }

        loadQuestions();
    </script>
</body>
</html>
